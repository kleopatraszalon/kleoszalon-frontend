name: Render force latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: render-force-latest-${{ github.repository }}
  cancel-in-progress: true

jobs:
  force-latest:
    name: Force latest Render frontend deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-d44vpbshq0os73fp2320
    steps:
      - name: Cancel stale Render deploys when API key is available
        if: ${{ env.RENDER_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
            -o /tmp/render-deploys.json

          node <<'NODE' >/tmp/stale-deploys.txt
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/render-deploys.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.items||raw.deploys||[]);
          const terminal=new Set(['live','deactivated','build_failed','update_failed','canceled','cancelled','pre_deploy_failed']);
          for(const row of rows){
            const d=row.deploy||row;
            const id=d.id||d.deployId;
            const status=String(d.status||'').toLowerCase();
            const commit=String(d.commit?.id||d.commitId||d.commit?.sha||'');
            if(id && !terminal.has(status) && commit!==process.env.GITHUB_SHA) console.log(id);
          }
          NODE

          while IFS= read -r deploy_id; do
            [ -n "$deploy_id" ] || continue
            echo "Cancelling stale Render deploy: $deploy_id"
            curl -sS --retry 3 --max-time 30 -o /tmp/cancel-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id/cancel" || true
            echo
          done </tmp/stale-deploys.txt

      - name: Force exact latest commit through Render API
        if: ${{ env.RENDER_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({commitId:process.env.GITHUB_SHA,clearCache:"clear"}))')"
          code="$(curl -sS --retry 3 --max-time 30 -o /tmp/render-trigger.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          cat /tmp/render-trigger.json || true
          echo
          case "$code" in 200|201|202) ;; *) echo "Render API trigger failed: HTTP $code" >&2; exit 1;; esac

      - name: Fallback to exact-SHA deploy hook
        if: ${{ env.RENDER_API_KEY == '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "Neither RENDER_API_KEY nor RENDER_FRONTEND_DEPLOY_HOOK_URL is configured." >&2
            exit 1
          fi
          sep='?'; [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          code="$(curl -sS --retry 5 --retry-all-errors --max-time 30 -o /tmp/hook-response.json -w '%{http_code}' -X POST "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${GITHUB_SHA}")"
          cat /tmp/hook-response.json || true
          echo
          case "$code" in 200|202) ;; *) echo "Render deploy hook failed: HTTP $code" >&2; exit 1;; esac

      - name: Mark force trigger accepted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Latest exact-SHA force trigger accepted by Render",context:"release-control/render-force-latest"}))')"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST --data "$body" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
