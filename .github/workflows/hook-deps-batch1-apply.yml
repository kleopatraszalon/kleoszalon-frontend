name: Apply safe hook dependency batch 1

on:
  push:
    branches:
      - maint/hook-deps-batch1-20260828
    paths:
      - .github/workflows/hook-deps-batch1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-batch1-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize low-risk hook dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:180]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          replace('src/pages/FitnessLockerPanel.tsx',
                  "const lockers:Locker[]=data?.lockers||[];const summary=data?.summary||{};",
                  "const lockers=useMemo<Locker[]>(()=>data?.lockers||[],[data?.lockers]);const summary=data?.summary||{};")

          replace('src/pages/WorkOrderDetail.tsx',
                  "const clients=editor?.clients||[];const employees=editor?.employees||[];",
                  "const clients=useMemo(()=>editor?.clients||[],[editor?.clients]);const employees=editor?.employees||[];")

          replace('src/pages/dashboard/WorkOrderDashboardPanel.tsx',
                  "const recent=useMemo(()=>Array.isArray(data?.recent)?data!.recent!.slice(0,5):[],[data?.recent]);",
                  "const recent=useMemo(()=>Array.isArray(data?.recent)?data.recent.slice(0,5):[],[data]);")

          replace('src/pages/finance/FinanceAltegioWorkspace.tsx',
                  'import React,{useEffect,useMemo,useState} from "react";',
                  'import React,{useCallback,useEffect,useMemo,useState} from "react";')
          replace('src/pages/finance/FinanceAltegioWorkspace.tsx',
                  'const filter=(rows:AnyRow[])=>rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));',
                  'const filter=useCallback((rows:AnyRow[])=>rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase())),[q]);')
          replace('src/pages/finance/FinanceAltegioWorkspace.tsx',
                  'const filteredAccounts=useMemo(()=>filter(dashboard?.accounts||accounts),[dashboard,accounts,q]);',
                  'const filteredAccounts=useMemo(()=>filter(dashboard?.accounts||accounts),[dashboard,accounts,filter]);')

          replace('src/pages/ClientsCRMCore.tsx',
                  'const location=useLocation();const navigate=useNavigate();const{language,locale,t}=useLanguage();const text=(hu:string,en:string)=>language==="en"?en:hu;const view=',
                  'const location=useLocation();const navigate=useNavigate();const{language,locale,t}=useLanguage();const text=useCallback((hu:string,en:string)=>language==="en"?en:hu,[language]);const view=')
          replace('src/pages/ClientsCRMCore.tsx',
                  '},[query,status,tagId,view,language]);',
                  '},[query,status,tagId,view,text]);')

          replace('src/pages/ServicesCatalogPage.tsx',
                  'import React, { useEffect, useMemo, useState } from "react";',
                  'import React, { useCallback, useEffect, useMemo, useState } from "react";')
          replace('src/pages/ServicesCatalogPage.tsx',
                  'const text=(hu:string,en:string)=>language==="en"?en:hu;',
                  'const text=useCallback((hu:string,en:string)=>language==="en"?en:hu,[language]);')
          replace('src/pages/ServicesCatalogPage.tsx',
                  '},[filtered,types,locale,language]);',
                  '},[filtered,types,locale,text]);')

          old_picker="""useEffect(()=>{if(!open)return;const plan=selectedServiceIds.length?api.get('/api/transactions/workorder-materials/plan',{params:{service_ids:selectedServiceIds.join(',')}}):Promise.resolve({data:{requirements:[]}} as any);Promise.allSettled([api.get('/api/services'),api.get('/api/products'),api.get('/api/product-categories'),plan]).then(([s,p,c,r])=>{if(s.status==='fulfilled')setServiceMeta(Array.isArray(s.value.data)?s.value.data:[]);if(p.status==='fulfilled')setProductMeta(Array.isArray(p.value.data)?p.value.data:[]);if(c.status==='fulfilled')setCategories(Array.isArray(c.value.data)?c.value.data:[]);if(r.status==='fulfilled')setMaterialRules(Array.isArray(r.value.data?.requirements)?r.value.data.requirements:[])}).catch(()=>undefined)},[open,selectedServiceIds.join(',')]);"""
          new_picker="""const selectedServiceIdsKey=useMemo(()=>selectedServiceIds.join(','),[selectedServiceIds]);\n useEffect(()=>{if(!open)return;const plan=selectedServiceIdsKey?api.get('/api/transactions/workorder-materials/plan',{params:{service_ids:selectedServiceIdsKey}}):Promise.resolve({data:{requirements:[]}} as any);Promise.allSettled([api.get('/api/services'),api.get('/api/products'),api.get('/api/product-categories'),plan]).then(([s,p,c,r])=>{if(s.status==='fulfilled')setServiceMeta(Array.isArray(s.value.data)?s.value.data:[]);if(p.status==='fulfilled')setProductMeta(Array.isArray(p.value.data)?p.value.data:[]);if(c.status==='fulfilled')setCategories(Array.isArray(c.value.data)?c.value.data:[]);if(r.status==='fulfilled')setMaterialRules(Array.isArray(r.value.data?.requirements)?r.value.data.requirements:[])}).catch(()=>undefined)},[open,selectedServiceIdsKey]);"""
          replace('src/pages/workorders/WorkOrderItemPickerModal.tsx',old_picker,new_picker)

          old_review="""const serviceIds=useMemo(()=>services.map(x=>String(x.id)),[services]);\n useEffect(()=>{let alive=true;if(!locationId||!serviceIds.length){setRequirements([]);setLoadError('');setLoading(false);return()=>{alive=false}}setLoading(true);setLoadError('');const q=new URLSearchParams({location_id:locationId,service_ids:serviceIds.join(',')});apiFetch<{requirements?:Requirement[]}>(`/api/transactions/workorder-materials/plan?${q.toString()}`).then(data=>{if(alive)setRequirements(Array.isArray(data.requirements)?data.requirements:[])}).catch((e:any)=>{if(alive){setRequirements([]);setLoadError(e?.message||'Az anyag-előírások ellenőrzése nem sikerült.')}}).finally(()=>{if(alive)setLoading(false)});return()=>{alive=false}},[locationId,serviceIds.join(',')]);"""
          new_review="""const serviceIds=useMemo(()=>services.map(x=>String(x.id)),[services]);\n const serviceIdsKey=useMemo(()=>serviceIds.join(','),[serviceIds]);\n useEffect(()=>{let alive=true;if(!locationId||!serviceIdsKey){setRequirements([]);setLoadError('');setLoading(false);return()=>{alive=false}}setLoading(true);setLoadError('');const q=new URLSearchParams({location_id:locationId,service_ids:serviceIdsKey});apiFetch<{requirements?:Requirement[]}>(`/api/transactions/workorder-materials/plan?${q.toString()}`).then(data=>{if(alive)setRequirements(Array.isArray(data.requirements)?data.requirements:[])}).catch((e:any)=>{if(alive){setRequirements([]);setLoadError(e?.message||'Az anyag-előírások ellenőrzése nem sikerült.')}}).finally(()=>{if(alive)setLoading(false)});return()=>{alive=false}},[locationId,serviceIdsKey]);"""
          replace('src/pages/workorders/WorkOrderReviewPanel.tsx',old_review,new_review)

          replace('scripts/run-release-lint.js',
                  'process.env.ESLINT_WARNING_BASELINE || 53',
                  'process.env.ESLINT_WARNING_BASELINE || 43')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 43-warning hook budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete frontend regression suite
        env:
          CI: true
        run: npm test -- --watchAll=false
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit hook cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/FitnessLockerPanel.tsx src/pages/WorkOrderDetail.tsx src/pages/dashboard/WorkOrderDashboardPanel.tsx src/pages/finance/FinanceAltegioWorkspace.tsx src/pages/ClientsCRMCore.tsx src/pages/ServicesCatalogPage.tsx src/pages/workorders/WorkOrderItemPickerModal.tsx src/pages/workorders/WorkOrderReviewPanel.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 53 to 43"
          git push origin HEAD:maint/hook-deps-batch1-20260828
