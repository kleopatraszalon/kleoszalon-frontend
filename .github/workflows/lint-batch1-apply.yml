name: Apply safe lint warning batch 1

on:
  push:
    branches:
      - maint/lint-warning-batch1-20260828
    paths:
      - .github/workflows/lint-batch1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/lint-warning-batch1-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply behavior-neutral unused-code cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:80]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          replace('src/pages/InventoryOperationsPage.tsx', ' const scopedWarehouses=useMemo(()=>warehouses.filter(w=>!locationId?true:String(w.location_id||"")===locationId),[warehouses,locationId]);\n', '')
          replace('src/pages/InventoryOperationsPage.tsx', ' const productById=useMemo(()=>new Map(products.map(p=>[String(p.id),p])),[products]);\n', '')
          replace('src/pages/InventoryOperationsPage.tsx', ';const out=balances.filter(b=>b.stock_status==="out").length;', ';')
          replace('src/pages/VirTopMetricsExtendedPage.tsx', ',[error,setError]=useState("");', ',[,setError]=useState("");')
          replace('src/pages/WorkOrderDetail.tsx', "import WorkOrderPaymentPanel,{PaymentDraft,PaymentMethod}from'./workorders/WorkOrderPaymentPanel';", "import WorkOrderPaymentPanel,{PaymentDraft}from'./workorders/WorkOrderPaymentPanel';")
          replace('src/pages/booking/BookingOperationsPanel.tsx', '  UserRoundCheck, UserRoundX, UsersRound,', '  UsersRound,')
          replace('scripts/run-release-lint.js', 'process.env.ESLINT_WARNING_BASELINE || 80', 'process.env.ESLINT_WARNING_BASELINE || 73')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify reduced lint budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Commit safe lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/InventoryOperationsPage.tsx src/pages/VirTopMetricsExtendedPage.tsx src/pages/WorkOrderDetail.tsx src/pages/booking/BookingOperationsPanel.tsx scripts/run-release-lint.js
          git commit -m "Reduce legacy lint warning budget from 80 to 73"
          git push origin HEAD:maint/lint-warning-batch1-20260828
