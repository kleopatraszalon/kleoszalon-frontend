name: VIR sidebar and menu invariant guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current sidebar architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "isAdmin?ADMIN_MENU" src/components/Sidebar.tsx
          grep -Fq "const [collapsed, setCollapsed] = useState(false)" src/layouts/AppLayout.tsx
          ! grep -Fq 'MobileSidebarFix.css' src/layouts/AppLayout.tsx
      - name: Verify new VIR navigation entries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Bizonylat-beérkeztetés','/finance/document-intake" src/config/adminMenu.ts
          grep -Fq "Altegio szinkron / import','/finance/altegio" src/config/adminMenu.ts
          grep -Fq "Számítógépes nyugták','/finance/receipts" src/config/adminMenu.ts
          grep -Fq "NAV Online Számla','/finance/nav-online-invoice" src/config/adminMenu.ts
          grep -Fq "Nyugta és NAV-adatszolgáltatás','/finance/receipt-compliance" src/config/adminMenu.ts
          grep -Fq "Cégek és könyvelési egységek','/settings/legal-entities" src/config/adminMenu.ts
          grep -Fq 'Altegio szinkron / import' src/components/AccountingSidebar.tsx
      - name: Typecheck and build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          CI=true DISABLE_ESLINT_PLUGIN=true npm run build
