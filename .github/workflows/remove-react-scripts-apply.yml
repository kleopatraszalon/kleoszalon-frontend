name: Verify react-scripts removal

on:
  push:
    branches:
      - modernize/remove-react-scripts-20260828
    paths:
      - .github/workflows/remove-react-scripts-apply.yml

permissions:
  contents: write

jobs:
  remove-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/remove-react-scripts-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install current dependencies
        run: npm ci --no-audit --no-fund
      - name: Make lint and PostCSS tooling explicit
        run: npm install --save-dev eslint@8.57.1 eslint-config-react-app@7.0.1 tailwindcss@3.4.19 autoprefixer@10.4.24 --no-audit --no-fund
      - name: Remove react-scripts runtime and CRA fallback commands
        run: |
          npm uninstall --save-dev react-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete p.scripts['start:cra'];
          delete p.scripts['build:cra'];
          delete p.scripts['test:cra'];
          delete p.scripts.eject;
          delete p.jest;
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ViteProductionBuild.contract.test.ts')
          text=p.read_text(encoding='utf-8')
          old='''test("Vite is the default development and production builder while CRA remains an explicit fallback", () => {\n  const pkg = JSON.parse(read("package.json"));\n  expect(pkg.scripts.start).toBe("vite");\n  expect(pkg.scripts.build).toBe("vite build --outDir build");\n  expect(pkg.scripts["start:cra"]).toBe("react-scripts start");\n  expect(pkg.scripts["build:cra"]).toBe("react-scripts build");\n  expect(pkg.scripts.test).toBe("vitest run");\n  expect(pkg.scripts["test:watch"]).toBe("vitest");\n  expect(pkg.scripts["test:cra"]).toBe("react-scripts test");\n});'''
          new='''test("Vite and Vitest are the sole frontend runtime toolchain", () => {\n  const pkg = JSON.parse(read("package.json"));\n  expect(pkg.scripts.start).toBe("vite");\n  expect(pkg.scripts.build).toBe("vite build --outDir build");\n  expect(pkg.scripts.test).toBe("vitest run");\n  expect(pkg.scripts["test:watch"]).toBe("vitest");\n  expect(pkg.scripts["start:cra"]).toBeUndefined();\n  expect(pkg.scripts["build:cra"]).toBeUndefined();\n  expect(pkg.scripts["test:cra"]).toBeUndefined();\n  expect(pkg.devDependencies?.["react-scripts"]).toBeUndefined();\n  expect(pkg.devDependencies?.["eslint-config-react-app"]).toBe("^7.0.1");\n  expect(pkg.devDependencies?.tailwindcss).toBe("^3.4.19");\n  expect(pkg.devDependencies?.autoprefixer).toBe("^10.4.24");\n});'''
          if old not in text:
              raise SystemExit('Vite production contract pattern missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Prove react-scripts is absent from the package contract
        run: |
          node -e "const p=require('./package.json'); if(p.devDependencies?.['react-scripts']||p.dependencies?.['react-scripts']) process.exit(1);"
          ! grep -q 'react-scripts' package.json
      - name: Snapshot migrated package contract
        run: |
          sha256sum package.json package-lock.json | tee /tmp/migrated-package.sha256
          cp package.json /tmp/migrated-package.json
          cp package-lock.json /tmp/migrated-package-lock.json
      - name: Verify deterministic clean install without react-scripts
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund
          cmp /tmp/migrated-package.json package.json
          cmp /tmp/migrated-package-lock.json package-lock.json
          sha256sum -c /tmp/migrated-package.sha256
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Verify 37-warning ESLint behavior
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit verified CRA runtime removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/ViteProductionBuild.contract.test.ts
          git commit -m "Remove react-scripts runtime fallback"
          git push origin HEAD:modernize/remove-react-scripts-20260828
