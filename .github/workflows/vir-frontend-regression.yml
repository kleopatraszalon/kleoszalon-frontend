name: VIR frontend regression gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vir-frontend-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vir-frontend-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      REACT_APP_API_ORIGIN: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Deterministic clean install
        run: npm ci --no-audit --no-fund

      - name: Verify clean lockfile install
        run: git diff --exit-code -- package-lock.json package.json

      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint zero-error / warning-regression gate
        run: npm run lint:strict

      - name: Run complete frontend regression suite
        run: npm test -- --watchAll=false --runInBand

      - name: Strict production build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build
