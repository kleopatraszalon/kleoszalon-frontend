name: P10 UI one-shot patch
on:
  push:
    branches: [feature/vir-p10-revenue-autopilot]
    paths: ['.github/workflows/p10-ui-one-shot.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/vir-p10-revenue-autopilot}
      - run: node scripts/apply-p10-ui-patch.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: wire VIR P10 revenue autopilot UI'
          git push origin HEAD:feature/vir-p10-revenue-autopilot
