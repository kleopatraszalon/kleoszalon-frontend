name: Finance v5 frontend wiring
on:
  push:
    branches: [feature/finance-v5-altegio-20260813]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-v5-altegio-20260813
      - name: Wire finance v5 routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          imp='const FinanceWorkspacePage = lazy(() => import("./pages/finance/FinanceWorkspacePage"));\n'
          if imp not in s:
              anchor='const Penzugy = lazy(() => import("./pages/Penzugy"));\n'
              if anchor not in s: raise SystemExit('Penzugy lazy import anchor not found')
              s=s.replace(anchor,anchor+imp,1)
          old='  { path: "/penzugy", element: A(<Penzugy />) },\n  { path: "/finance", element: A(<Penzugy />) },'
          new='  { path: "/penzugy", element: A(<FinanceWorkspacePage />) },\n  { path: "/finance", element: A(<FinanceWorkspacePage />) },\n  { path: "/finance/checkout", element: A(<Penzugy />) },'
          if old in s:
              s=s.replace(old,new,1)
          elif '/finance/checkout' not in s:
              raise SystemExit('finance route anchor not found')
          old='  { path: "/finance/*", element: A(<Penzugy />) },'
          new='  { path: "/finance/*", element: A(<FinanceWorkspacePage />) },'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('src/pages/finance/FinanceWorkspacePage.tsx')
          s=p.read_text()
          old='await api.patch(`${BASE}/settings`,settings)'
          new='await api.patch(`${BASE}/settings${q(scoped)}`,settings)'
          if old not in s and new not in s: raise SystemExit('settings patch anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git add src/App.tsx src/pages/finance/FinanceWorkspacePage.tsx
          git commit -m "feat(finance): wire v5 workspace routes"
          git push origin HEAD:feature/finance-v5-altegio-20260813
