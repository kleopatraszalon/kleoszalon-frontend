name: Apply safe lint warning batch 3

on:
  push:
    branches:
      - maint/lint-warning-batch3-20260828
    paths:
      - .github/workflows/lint-batch3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/lint-warning-batch3-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Parenthesize mixed operators without changing precedence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'src/pages/WorkOrderNew.tsx',
              "const bad=materials.find(m=>m.quantity<=0||m.availableStock!=null&&m.quantity>Number(m.availableStock));",
              "const bad=materials.find(m=>m.quantity<=0||(m.availableStock!=null&&m.quantity>Number(m.availableStock)));",
          )
          replace(
              'src/pages/WorkOrderNew.tsx',
              "{i<4||i===4&&reviewReady||i===5&&paymentReady?'✓':i+1}",
              "{i<4||(i===4&&reviewReady)||(i===5&&paymentReady)?'✓':i+1}",
          )
          replace(
              'src/pages/workorders/WorkOrderLoyaltyPanel.tsx',
              "const matches=!restrictions.length||restrictions.some((x:any)=>x.target_type==='service'&&serviceIds.map(String).includes(String(x.target_id))||x.target_type==='product'&&productIds.map(String).includes(String(x.target_id)));",
              "const matches=!restrictions.length||restrictions.some((x:any)=>(x.target_type==='service'&&serviceIds.map(String).includes(String(x.target_id)))||(x.target_type==='product'&&productIds.map(String).includes(String(x.target_id))));",
          )
          replace(
              'scripts/run-release-lint.js',
              'process.env.ESLINT_WARNING_BASELINE || 63',
              'process.env.ESLINT_WARNING_BASELINE || 53',
          )
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify reduced lint budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete frontend regression suite
        env:
          CI: true
        run: npm test -- --watchAll=false
      - name: Verify Vite production build
        run: npm run build
      - name: Commit safe lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/WorkOrderNew.tsx src/pages/workorders/WorkOrderLoyaltyPanel.tsx scripts/run-release-lint.js
          git commit -m "Reduce legacy lint warning budget from 63 to 53"
          git push origin HEAD:maint/lint-warning-batch3-20260828
