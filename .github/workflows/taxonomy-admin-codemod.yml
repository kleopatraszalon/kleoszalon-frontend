name: Taxonomy admin route codemod
on:
  push:
    branches:
      - feature/inventory-taxonomy-admin-v3-20260813
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-taxonomy-admin-v3-20260813
          fetch-depth: 0
      - name: Patch App routes safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          imp='const ProductTaxonomyReviewPage = lazy(() => import("./pages/ProductTaxonomyReviewPage"));'
          if imp not in s:
              needle='const ProductsList = lazy(() => import("./pages/ProductsList"));'
              if needle not in s: raise SystemExit('ProductsList import anchor missing')
              s=s.replace(needle, needle+'\n'+imp, 1)
          route='  { path: "/masterdata/products/taxonomy-review", element: R(MANAGEMENT, <ProductTaxonomyReviewPage />) },'
          if route not in s:
              needle='  { path: "/warehouse/products", element: A(<ProductsList />) },'
              if needle not in s: raise SystemExit('products route anchor missing')
              s=s.replace(needle, route+'\n'+needle, 1)
          p.write_text(s)
          PY
      - name: Commit route integration
        run: |
          if git diff --quiet -- src/App.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat(inventory): route taxonomy review admin"
          git push origin HEAD:feature/inventory-taxonomy-admin-v3-20260813
