name: Apply safe hook dependency batch 4

on:
  push:
    branches:
      - maint/hook-deps-batch4-20260828
    paths:
      - .github/workflows/hook-deps-batch4-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-batch4-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize fourth low-risk hook batch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:180]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          def replace_after(path, anchor, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              start=text.find(anchor)
              if start < 0:
                  raise SystemExit(f'Anchor missing in {path}: {anchor[:180]!r}')
              pos=text.find(old,start)
              if pos < 0:
                  raise SystemExit(f'Expected pattern after anchor missing in {path}: {old[:180]!r}')
              text=text[:pos]+new+text[pos+len(old):]
              p.write_text(text,encoding='utf-8')

          # UAT issue list: load depends only on runId.
          replace('src/pages/UatIssuesPanel.tsx',"import React,{useEffect,useMemo,useState}from'react';","import React,{useCallback,useEffect,useMemo,useState}from'react';")
          replace('src/pages/UatIssuesPanel.tsx','async function load(){','const load=useCallback(async()=>{')
          replace_after('src/pages/UatIssuesPanel.tsx','const load=useCallback(async()=>{','}useEffect(()=>{void load()},[runId]);','},[runId]);useEffect(()=>{void load()},[load]);')

          # Staff chat: polling callback is driven only by the search query.
          replace('src/pages/StaffChatPage.tsx','import React,{FormEvent,useEffect,useRef,useState}from"react";','import React,{FormEvent,useCallback,useEffect,useRef,useState}from"react";')
          replace('src/pages/StaffChatPage.tsx',' const loadLists=async()=>{',' const loadLists=useCallback(async()=>{')
          replace_after('src/pages/StaffChatPage.tsx',' const loadLists=useCallback(async()=>{','};\n useEffect(()=>{loadLists();const timer=window.setInterval(loadLists,30000);return()=>window.clearInterval(timer)},[q]);','},[q]);\n useEffect(()=>{loadLists();const timer=window.setInterval(loadLists,30000);return()=>window.clearInterval(timer)},[loadLists]);')

          # Booking communication queue: selected location is the only loader dependency.
          replace('src/pages/booking/BookingNotificationAutomation.tsx','import React,{useEffect,useMemo,useState}from"react";','import React,{useCallback,useEffect,useMemo,useState}from"react";')
          replace('src/pages/booking/BookingNotificationAutomation.tsx',' const load=async()=>{',' const load=useCallback(async()=>{')
          replace_after('src/pages/booking/BookingNotificationAutomation.tsx',' const load=useCallback(async()=>{','};\n useEffect(()=>{void loadLocations();void loadFailureAnalysis()},[]);useEffect(()=>{void load()},[locationId]);','},[locationId]);\n useEffect(()=>{void loadLocations();void loadFailureAnalysis()},[]);useEffect(()=>{void load()},[load]);')

          # Central supply: loader follows the derived location query.
          replace('src/pages/inventory/CentralSupplyPanel.tsx','import React,{useEffect,useMemo,useState}from"react";','import React,{useCallback,useEffect,useMemo,useState}from"react";')
          replace('src/pages/inventory/CentralSupplyPanel.tsx','async function load(){','const load=useCallback(async()=>{')
          replace_after('src/pages/inventory/CentralSupplyPanel.tsx','const load=useCallback(async()=>{','}\n useEffect(()=>{void load()},[locationId]);','},[query]);\n useEffect(()=>{void load()},[load]);')

          # Inventory control dashboard: location drives loader, refreshKey only retriggers it.
          replace('src/pages/inventory/InventoryControlDashboard.tsx',"import React,{useEffect,useMemo,useState}from'react';","import React,{useCallback,useEffect,useMemo,useState}from'react';")
          replace('src/pages/inventory/InventoryControlDashboard.tsx',' async function load(){',' const load=useCallback(async()=>{')
          replace_after('src/pages/inventory/InventoryControlDashboard.tsx',' const load=useCallback(async()=>{','}\n useEffect(()=>{void load()},[locationId,refreshKey]);','},[locationId]);\n useEffect(()=>{void load()},[load,refreshKey]);')

          # Work-order guest context: selected customer drives CRM context loader.
          replace('src/pages/workorders/WorkOrderGuestContextPanel.tsx',"import React,{useEffect,useMemo,useState}from'react';","import React,{useCallback,useEffect,useMemo,useState}from'react';")
          replace('src/pages/workorders/WorkOrderGuestContextPanel.tsx',' async function load(){',' const load=useCallback(async()=>{')
          replace_after('src/pages/workorders/WorkOrderGuestContextPanel.tsx',' const load=useCallback(async()=>{','}\n useEffect(()=>{void load()},[customerId]);','},[customerId]);\n useEffect(()=>{void load()},[load]);')

          # Work-order invoice: invoice/readiness loader follows work order id.
          replace('src/pages/workorders/WorkOrderInvoicePanel.tsx',"import React,{useEffect,useState}from'react';","import React,{useCallback,useEffect,useState}from'react';")
          replace('src/pages/workorders/WorkOrderInvoicePanel.tsx',' async function load(){',' const load=useCallback(async()=>{')
          replace_after('src/pages/workorders/WorkOrderInvoicePanel.tsx',' const load=useCallback(async()=>{',' }\n useEffect(()=>{void load()},[workOrderId]);',' },[workOrderId]);\n useEffect(()=>{void load()},[load]);')

          # Work-order viewer: route id drives the document loader.
          replace('src/pages/WorkOrderView.tsx',"import React,{useEffect,useMemo,useState}from'react';","import React,{useCallback,useEffect,useMemo,useState}from'react';")
          replace('src/pages/WorkOrderView.tsx','async function load(){','const load=useCallback(async()=>{')
          replace_after('src/pages/WorkOrderView.tsx','const load=useCallback(async()=>{','}useEffect(()=>{void load()},[id]);','},[id]);useEffect(()=>{void load()},[load]);')

          # Spec parity: year drives the aggregate fetch.
          replace('src/pages/VirSpecParityPage.tsx','import React,{useEffect,useMemo,useRef,useState}from"react";','import React,{useCallback,useEffect,useMemo,useRef,useState}from"react";')
          replace('src/pages/VirSpecParityPage.tsx',' async function loadAll(silent=false){',' const loadAll=useCallback(async(silent=false)=>{')
          replace_after('src/pages/VirSpecParityPage.tsx',' const loadAll=useCallback(async(silent=false)=>{','}\n useEffect(()=>{void loadAll()},[year]);','},[year]);\n useEffect(()=>{void loadAll()},[loadAll]);')

          # Finance Altegio: make query builder and loader stable.
          replace('src/pages/finance/FinanceAltegioWorkspace.tsx',' const qs=(extra="")=>[loc,extra].filter(Boolean).join("&");',' const qs=useCallback((extra="")=>[loc,extra].filter(Boolean).join("&"),[loc]);')
          replace('src/pages/finance/FinanceAltegioWorkspace.tsx',' async function loadAll(){',' const loadAll=useCallback(async()=>{')
          replace_after('src/pages/finance/FinanceAltegioWorkspace.tsx',' const loadAll=useCallback(async()=>{','}\n useEffect(()=>{void loadAll()},[]);','},[from,to,loc,qs]);\n useEffect(()=>{void loadAll()},[loadAll]);')

          replace('scripts/run-release-lint.js','process.env.ESLINT_WARNING_BASELINE || 30','process.env.ESLINT_WARNING_BASELINE || 20')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 20-warning hook budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit hook cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/UatIssuesPanel.tsx src/pages/StaffChatPage.tsx src/pages/booking/BookingNotificationAutomation.tsx src/pages/inventory/CentralSupplyPanel.tsx src/pages/inventory/InventoryControlDashboard.tsx src/pages/workorders/WorkOrderGuestContextPanel.tsx src/pages/workorders/WorkOrderInvoicePanel.tsx src/pages/WorkOrderView.tsx src/pages/VirSpecParityPage.tsx src/pages/finance/FinanceAltegioWorkspace.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 30 to 20"
          git push origin HEAD:maint/hook-deps-batch4-20260828
