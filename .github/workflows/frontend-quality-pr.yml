name: Frontend PR quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend strict quality / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Apply compatible production security fixes
        if: ${{ github.head_ref == 'agent/frontend-react-router-security' }}
        run: npm audit fix --omit=dev

      - name: Commit dependency remediation
        if: ${{ github.head_ref == 'agent/frontend-react-router-security' }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency remediation changes remain."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Remediate frontend production dependency advisories"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify clean lockfile install
        run: git diff --exit-code -- package-lock.json package.json

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint zero-error / warning-regression gate
        run: npm run lint:strict

      - name: Frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Strict production build
        env:
          CI: true
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build

  dispatch-main-release:
    name: Dispatch exact-SHA main release
    needs: quality
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-control-frontend-diagnostic-20260818' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch render-deploy on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST \
            --data '{"ref":"main"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/render-deploy.yml/dispatches"
          echo "Main render-deploy workflow dispatched."
