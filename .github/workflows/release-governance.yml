name: Release Governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        env:
          CI: true
        run: npm test -- --watchAll=false
      - name: Assert browser auth is cookie-only
        run: |
          ! grep -R "Authorization =.*Bearer" -n src/api src/utils src/pages/Login.tsx
          ! grep -R "body.token" -n src/pages/Login.tsx
