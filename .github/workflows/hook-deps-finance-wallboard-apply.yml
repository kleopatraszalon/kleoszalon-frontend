name: Apply finance and WallBoard hook cleanup

on:
  push:
    branches:
      - maint/hook-deps-finance-wallboard-20260828
    paths:
      - .github/workflows/hook-deps-finance-wallboard-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-finance-wallboard-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Preserve mount-only loaders with explicit refs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'Expected pattern missing in {path}: {old[:180]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace('src/pages/PenzugyLegacy.tsx',
                  'import React,{useEffect,useMemo,useState}from"react";',
                  'import React,{useEffect,useMemo,useRef,useState}from"react";')
          replace('src/pages/PenzugyLegacy.tsx',
                  ' useEffect(()=>{void load()},[]);',
                  ' const initialLoadRef=useRef(load);\n useEffect(()=>{void initialLoadRef.current()},[]);')

          replace('src/pages/WallBoardDailyActionPage.tsx',
                  'import React,{useEffect,useMemo,useState}from"react";',
                  'import React,{useEffect,useMemo,useRef,useState}from"react";')
          replace('src/pages/WallBoardDailyActionPage.tsx',
                  ' useEffect(()=>{void load();void loadLocations();void(async()=>{await loadAuto();await loadActionServices()})()},[]);',
                  ' const initialLoadRef=useRef(load);\n const initialLoadAutoRef=useRef(loadAuto);\n useEffect(()=>{void initialLoadRef.current();void loadLocations();void(async()=>{await initialLoadAutoRef.current();await loadActionServices()})()},[]);')

          replace('scripts/run-release-lint.js',
                  'process.env.ESLINT_WARNING_BASELINE || 5',
                  'process.env.ESLINT_WARNING_BASELINE || 3')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 3-warning budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PenzugyLegacy.tsx src/pages/WallBoardDailyActionPage.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 5 to 3"
          git push origin HEAD:maint/hook-deps-finance-wallboard-20260828
