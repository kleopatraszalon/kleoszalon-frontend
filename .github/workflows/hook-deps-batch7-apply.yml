name: Apply safe hook dependency batch 7

on:
  push:
    branches:
      - maint/hook-deps-batch7-20260828
    paths:
      - .github/workflows/hook-deps-batch7-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-batch7-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize inventory hook dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/InventoryLotsPage.tsx')
          text=p.read_text(encoding='utf-8')
          pairs=[
            ('import React, { useEffect, useMemo, useState } from "react";', 'import React, { useCallback, useEffect, useMemo, useState } from "react";'),
            ('  const load=async()=>{', '  const load=useCallback(async()=>{'),
            ('    }catch(e:any){setError(getMessage(e))}finally{setLoading(false)}\n  };\n  const loadLots=async()=>{', '    }catch(e:any){setError(getMessage(e))}finally{setLoading(false)}\n  },[receipt.warehouse_id]);\n  const loadLots=useCallback(async()=>{'),
            ('    }catch(e:any){setError(getMessage(e))}\n  };\n  useEffect(()=>{void load()},[]);\n  useEffect(()=>{void loadLots()},[warehouseId,productId,status]);', '    }catch(e:any){setError(getMessage(e))}\n  },[productId,status,warehouseId]);\n  useEffect(()=>{void load()},[load]);\n  useEffect(()=>{void loadLots()},[loadLots]);'),
            ('  useEffect(()=>{if(selectedTracking){setLotTracking(Boolean(selectedTracking.lot_tracking_enabled));setExpiryTracking(Boolean(selectedTracking.expiry_tracking_enabled));setFefo(Boolean(selectedTracking.fefo_enabled))}},[trackProductId,products]);', '  useEffect(()=>{if(selectedTracking){setLotTracking(Boolean(selectedTracking.lot_tracking_enabled));setExpiryTracking(Boolean(selectedTracking.expiry_tracking_enabled));setFefo(Boolean(selectedTracking.fefo_enabled))}},[selectedTracking]);'),
          ]
          for old,new in pairs:
              if old not in text:
                  raise SystemExit(f'Expected pattern missing: {old[:180]!r}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          lint=Path('scripts/run-release-lint.js')
          s=lint.read_text(encoding='utf-8')
          old='process.env.ESLINT_WARNING_BASELINE || 9'
          new='process.env.ESLINT_WARNING_BASELINE || 6'
          if old not in s: raise SystemExit('Expected lint baseline 9 missing')
          lint.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 6-warning budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/InventoryLotsPage.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 9 to 6"
          git push origin HEAD:maint/hook-deps-batch7-20260828
