name: Security audit agent
on:
  push:
    branches:
      - agent/security-regression-hardening-20260814
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-fund
      - name: Report stale lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json nincs szinkronban a package.json-nal; az npm install módosította volna."
          fi
      - name: Critical navigation regression audit
        run: node scripts/check-menu-routes.js
      - name: Production build
        run: CI=false npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit report
        run: npm audit --json || true
