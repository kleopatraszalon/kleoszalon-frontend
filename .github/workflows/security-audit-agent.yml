name: Security audit agent
on:
  push:
    branches:
      - agent/security-regression-hardening-20260814
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize hardening branch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/App.tsx';
          let app = fs.readFileSync(path, 'utf8');
          const wrong = '  { path: "/hr/positions", element: A(<EmployeesList />) },\n';
          if (app.includes(wrong)) {
            app = app.replace(wrong, '');
            fs.writeFileSync(path, app);
            console.log('Removed duplicate /hr/positions route.');
          }
          NODE
          git rm --cached --ignore-unmatch kleopatra-landing/kleopatra-landing || true
          rm -rf kleopatra-landing/kleopatra-landing || true
          npm install --package-lock-only --ignore-scripts --no-fund

      - name: Commit normalization if needed
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/App.tsx package-lock.json
            git add -u kleopatra-landing/kleopatra-landing || true
            git commit -m "fix: normalize routes lockfile and broken gitlink"
            git push origin HEAD:agent/security-regression-hardening-20260814
          else
            echo "No normalization changes required."
          fi

      - name: Install dependencies
        run: npm ci --no-fund
      - name: Critical navigation regression audit
        run: node scripts/check-menu-routes.js
      - name: Production build
        run: CI=false npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit report
        run: npm audit --json || true
