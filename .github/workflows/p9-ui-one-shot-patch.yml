name: P9 UI one-shot patch
on:
  push:
    branches: [feature/vir-p9-marketing-automation]
    paths: ['.github/workflows/p9-ui-one-shot-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/vir-p9-marketing-automation}
      - run: node scripts/apply-p9-ui-route-patch.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: wire P9 and receptionist guest actions navigation'
          git push origin HEAD:feature/vir-p9-marketing-automation
