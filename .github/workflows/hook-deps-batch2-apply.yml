name: Apply safe hook dependency batch 2

on:
  push:
    branches:
      - maint/hook-deps-batch2-20260828
    paths:
      - .github/workflows/hook-deps-batch2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-batch2-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize second low-risk hook batch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:180]!r}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          replace('src/pages/CentralMasterDataPage.tsx',
                  'useEffect(()=>{if(current)void loadRelations(current)},[current?.key,loadRelations]);',
                  'useEffect(()=>{if(current)void loadRelations(current)},[current,loadRelations]);')

          replace('src/pages/OperationsQualityPage.tsx',
                  'useEffect(()=>{setForm(fresh(moduleKey,cfg));void load()},[moduleKey,load]);',
                  'useEffect(()=>{setForm(fresh(moduleKey,cfg));void load()},[moduleKey,cfg,load]);')

          replace('src/pages/VirTopMetricsExtendedPage.tsx',
                  'const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),1),from=iso(start),to=iso(today),prev=previousPeriod(from,to),days=Math.max(1,today.getDate());',
                  'const today=new Date(),start=new Date(today.getFullYear(),today.getMonth(),1),from=iso(start),to=iso(today),prev=useMemo(()=>previousPeriod(from,to),[from,to]),days=Math.max(1,today.getDate());')
          replace('src/pages/VirTopMetricsExtendedPage.tsx',
                  '},[from,to,prev.from,prev.to]);',
                  '},[from,to,prev]);')

          replace('src/pages/finance/FinanceWorkspacePage.tsx',
                  'const scoped={location_id:locationId||undefined};',
                  'const scoped=useMemo(()=>({location_id:locationId||undefined}),[locationId]);')
          replace('src/pages/finance/FinanceWorkspacePage.tsx',
                  '},[tab,tick,from,to,accountFilter,categoryFilter,partnerFilter,methodFilter,direction,search]);',
                  '},[tab,tick,from,to,accountFilter,categoryFilter,partnerFilter,methodFilter,direction,search,scoped]);')

          replace('src/pages/booking/AdvancedBookingLauncher.tsx',
                  'import React,{useEffect,useMemo,useState}from"react";',
                  'import React,{useCallback,useEffect,useMemo,useState}from"react";')
          replace('src/pages/booking/AdvancedBookingLauncher.tsx',
                  'const loadResources=async(loc=locationId)=>{if(!loc)return setResources([]);try{const r=await api.get(`${prefix}/resources`,{params:{location_id:loc}});setResources(arr<BookingResource>(r.data))}catch(e){setError(errorText(e))}};',
                  'const loadResources=useCallback(async(loc:string)=>{if(!loc)return setResources([]);try{const r=await api.get("/transactions/booking-operations/advanced/resources",{params:{location_id:loc}});setResources(arr<BookingResource>(r.data))}catch(e){setError(errorText(e))}},[]);')
          replace('src/pages/booking/AdvancedBookingLauncher.tsx',
                  '},[open]);',
                  '},[open,user?.location_id,loadResources]);')
          replace('src/pages/booking/AdvancedBookingLauncher.tsx',
                  'useEffect(()=>{if(open&&locationId)void loadResources(locationId)},[locationId,open]);',
                  'useEffect(()=>{if(open&&locationId)void loadResources(locationId)},[locationId,open,loadResources]);')
          replace('src/pages/booking/AdvancedBookingLauncher.tsx',
                  'await loadResources()',
                  'await loadResources(locationId)')

          replace('scripts/run-release-lint.js',
                  'process.env.ESLINT_WARNING_BASELINE || 43',
                  'process.env.ESLINT_WARNING_BASELINE || 37')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 37-warning hook budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit hook cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CentralMasterDataPage.tsx src/pages/OperationsQualityPage.tsx src/pages/VirTopMetricsExtendedPage.tsx src/pages/finance/FinanceWorkspacePage.tsx src/pages/booking/AdvancedBookingLauncher.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 43 to 37"
          git push origin HEAD:maint/hook-deps-batch2-20260828
