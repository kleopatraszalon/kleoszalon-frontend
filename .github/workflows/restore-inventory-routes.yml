name: Restore inventory routes
on:
  push:
    branches: [feature/finance-altegio-v2-20260813]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-altegio-v2-20260813
      - name: Restore routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          anchor='const ProductsList = lazy(() => import("./pages/ProductsList"));\n'
          imports=('const ProductTaxonomyReviewPage = lazy(() => import("./pages/ProductTaxonomyReviewPage"));\n'
                   'const InventoryOperationsPage = lazy(() => import("./pages/InventoryOperationsPage"));\n')
          if 'const InventoryOperationsPage' not in s:
              s=s.replace(anchor,anchor+imports,1)
          route_anchor='  { path: "/warehouse/products", element: A(<ProductsList />) },\n'
          routes=('  { path: "/warehouse/operations", element: R(KIOSK_MANAGERS, <InventoryOperationsPage />) },\n'
                  '  { path: "/masterdata/products/taxonomy-review", element: R(MANAGEMENT, <ProductTaxonomyReviewPage />) },\n')
          if '/warehouse/operations' not in s:
              s=s.replace(route_anchor,routes+route_anchor,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git add src/App.tsx
          git commit -m "fix(app): restore inventory operations and taxonomy routes"
          git push origin HEAD:feature/finance-altegio-v2-20260813
