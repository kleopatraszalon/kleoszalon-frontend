name: Force full VIR admin menu
on:
  push:
    paths:
      - '.github/workflows/force-full-admin-menu.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce exhaustive admin sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/Sidebar.tsx')
          s=p.read_text()
          marker="const visible=useMemo(()=>{const base="
          replacement="const visible=useMemo(()=>{if(isAdmin)return ADMIN_MENU as MenuItem[];const base="
          if marker in s:
              s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Verify every canonical admin group
        run: |
          grep -q "if(isAdmin)return ADMIN_MENU as MenuItem\[\]" src/components/Sidebar.tsx
          for label in \
            "Irányítópult" \
            "Időpontok és beosztás" \
            "Ügyfelek és CRM" \
            "Hűség, bérletek és ajándékkártyák" \
            "Munkatársak és HR" \
            "Működés és minőség" \
            "Pénzügyek" \
            "Raktár és készlet" \
            "Beszerzés" \
            "Statisztika és VIR" \
            "Marketing" \
            "Online foglalás és alkalmazás" \
            "Webshop és értékesítés" \
            "Tudásbázis" \
            "Törzsadatok" \
            "Telephelyek" \
            "Fitnesz – Gyöngyös" \
            "Franchise" \
            "SaaS admin" \
            "Vállalatirányítási eszközök" \
            "Beállítások és adminisztráció"; do
              grep -q "$label" src/config/adminMenu.ts
          done
          grep -q "Intelligens várólista" src/config/adminMenu.ts
          grep -q "Customer Intelligence / Next Best Action" src/config/adminMenu.ts
          grep -q "VIR Migrációs Központ v18" src/config/adminMenu.ts
          grep -q "SaaS Revenue Engine" src/config/adminMenu.ts
          grep -q "Release Control Center" src/config/adminMenu.ts
      - name: Install, test and build
        run: |
          npm ci --include=dev
          npx tsc --noEmit
          npm test -- --runInBand
          npm run build
      - name: Commit sidebar invariant directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.tsx
          if git diff --cached --quiet; then
            echo "Sidebar already exhaustive"
          else
            git commit -m "Make complete canonical admin menu unconditional"
            git push origin HEAD:main
          fi
