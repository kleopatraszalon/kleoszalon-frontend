name: Force full VIR admin menu
on:
  push:
    paths:
      - '.github/workflows/force-full-admin-menu.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce complete admin menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/Sidebar.tsx')
          s=p.read_text()
          # Admin must never lose Gyongyos Fitness because an access probe is slow or unavailable.
          s=s.replace("}else if(isAdmin&&!fitnessAllowed){combined=base.filter(x=>x.code!=='fitness.gyongyos')}","}")
          # Add a first-class Franchise root instead of burying it under settings.
          anchor="const CUSTOMER_INTELLIGENCE_CHILD:MenuItem="
          franchise="const FRANCHISE_ADMIN_TOOLS:MenuItem={id:99410,code:'franchise.admin',name:'Franchise',icon:'Building2',children:[{id:994101,name:'Franchise központ',route:'/admin/saas?workspace=franchise',children:[]},{id:994102,name:'Franchise érdeklődők és Mailchimp',route:'/admin/franchise-leads',children:[]},{id:994103,name:'SaaS platform és franchise',route:'/admin/saas',children:[]}]};\n"
          if 'const FRANCHISE_ADMIN_TOOLS:MenuItem=' not in s:
              s=s.replace(anchor,franchise+anchor)
          old="if(isAdmin){combined=stripRoutes(combined,new Set(['/admin/saas','/admin/saas?workspace=migration-center']));combined=[...combined,SAAS_ADMIN_TOOLS]}"
          new="if(isAdmin){combined=stripRoutes(combined,new Set(['/admin/saas','/admin/saas?workspace=migration-center','/admin/franchise-leads']));combined=[...combined,FRANCHISE_ADMIN_TOOLS,SAAS_ADMIN_TOOLS]}"
          s=s.replace(old,new)
          # Admin canonical menu is authoritative: VIR customization switches must not hide modules from administrators.
          s=s.replace("return configuredMenu(combined,vir)},[isCustomer,isAccounting,isLocationScoped,isStaff,isAdmin,isManager,menus,vir,fitnessAllowed]);","return isAdmin?combined:configuredMenu(combined,vir)},[isCustomer,isAccounting,isLocationScoped,isStaff,isAdmin,isManager,menus,vir,fitnessAllowed]);")
          p.write_text(s)
          PY
      - name: Verify full-menu invariant
        run: |
          grep -q "FRANCHISE_ADMIN_TOOLS" src/components/Sidebar.tsx
          grep -q "return isAdmin?combined:configuredMenu" src/components/Sidebar.tsx
          ! grep -q "isAdmin&&!fitnessAllowed" src/components/Sidebar.tsx
          grep -q "fitness.gyongyos" src/config/adminMenu.ts
          grep -q "Franchise érdeklődők és Mailchimp" src/config/adminMenu.ts
          grep -q "Intelligens várólista" src/config/adminMenu.ts
          grep -q "Customer Intelligence / Next Best Action" src/config/adminMenu.ts
          grep -q "Release Control Center" src/config/adminMenu.ts
      - name: Install and build
        run: |
          npm ci --include=dev
          npx tsc --noEmit
          npm test -- --runInBand
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.tsx
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Enforce complete admin menu including franchise and fitness"
            git push origin HEAD:main
          fi
