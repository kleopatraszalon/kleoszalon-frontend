name: Apply WorkOrder hook dependency cleanup

on:
  push:
    branches:
      - maint/hook-deps-workorder-20260828
    paths:
      - .github/workflows/hook-deps-workorder-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-workorder-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize WorkOrder initial options loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/WorkOrderNew.tsx')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ("import React,{useEffect,useMemo,useState}from'react';", "import React,{useCallback,useEffect,useMemo,useRef,useState}from'react';"),
            ("const[locations,setLocations]=useState<Location[]>([]);const[locationId,setLocationId]=useState('');const[employees,setEmployees]=useState<Employee[]>([]);const[clients,setClients]=useState<Client[]>([]);const[services,setServices]=useState<Service[]>([]);const[products,setProducts]=useState<Product[]>([]);const[appointment,setAppointment]=useState<Appointment|null>(null);const[optionsLoading,setOptionsLoading]=useState(false);const[appointmentApplied,setAppointmentApplied]=useState(false);", "const[locations,setLocations]=useState<Location[]>([]);const[locationId,setLocationId]=useState('');const[employees,setEmployees]=useState<Employee[]>([]);const[clients,setClients]=useState<Client[]>([]);const[services,setServices]=useState<Service[]>([]);const[products,setProducts]=useState<Product[]>([]);const[appointment,setAppointment]=useState<Appointment|null>(null);const[optionsLoading,setOptionsLoading]=useState(false);const appointmentAppliedRef=useRef(false);"),
            (" async function loadOptions(loc:string,employee:string,applyAppointment=false){", " const loadOptions=useCallback(async(loc:string,employee:string,applyAppointment=false)=>{"),
            ("if(applyAppointment&&data.appointment&&!appointmentApplied){", "if(applyAppointment&&data.appointment&&!appointmentAppliedRef.current){"),
            ("setSelectedServiceIds((a.services||[]).map(s=>String(s.service_id)));setAppointmentApplied(true)}}catch", "setSelectedServiceIds((a.services||[]).map(s=>String(s.service_id)));appointmentAppliedRef.current=true}}catch"),
            ("finally{setOptionsLoading(false)}}\n useEffect(()=>{if(userLoading||!user)return;const own=isAdmin?'':String(user.location_id||'');void loadOptions(own,'',true)},[userLoading,user?.id,appointmentId]);", "finally{setOptionsLoading(false)}},[appointmentId]);\n useEffect(()=>{if(userLoading||!user)return;const own=isAdmin?'':String(user.location_id||'');void loadOptions(own,'',true)},[isAdmin,loadOptions,user,userLoading]);")
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit(f'Expected WorkOrder pattern missing: {old[:180]!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          lint=Path('scripts/run-release-lint.js')
          t=lint.read_text(encoding='utf-8')
          old='process.env.ESLINT_WARNING_BASELINE || 6'
          new='process.env.ESLINT_WARNING_BASELINE || 5'
          if old not in t: raise SystemExit('Expected lint baseline 6 missing')
          lint.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 5-warning budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/WorkOrderNew.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 6 to 5"
          git push origin HEAD:maint/hook-deps-workorder-20260828
