name: Booking 4 growth gallery fix
on:
  push:
    branches: [feature/booking-4-growth]
    paths: [.github/workflows/booking-v4-growth-gallery-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/booking-4-growth
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/BookingV4GrowthPage.tsx');s=p.read_text().replace('selectedStaff?.portfolio||[]','selectedStaff?.reference_photos||[]')
          p.write_text(s)
          PY
      - run: grep -q 'selectedStaff?.reference_photos' src/pages/BookingV4GrowthPage.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/pages/BookingV4GrowthPage.tsx
          git diff --cached --quiet || (git commit -m "fix(booking-v4): show persisted reference photos" && git push origin HEAD:feature/booking-4-growth)
