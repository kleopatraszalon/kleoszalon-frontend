name: Inventory v4 type fix
on:
  push:
    branches: [feature/inventory-operations-v4-20260813]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-operations-v4-20260813
      - name: Fix stocktake item type
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/InventoryOperationsPage.tsx')
          s=p.read_text()
          old='counted_quantity:number|string|null;difference:number|string;difference_value:number|string'
          new='counted_quantity:number|string|null;unit_cost:number|string;difference:number|string;difference_value:number|string'
          if old not in s:
              raise SystemExit('StocktakeItem type anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git add src/pages/InventoryOperationsPage.tsx
          git commit -m "fix(inventory): type stocktake unit cost"
          git push origin HEAD:feature/inventory-operations-v4-20260813
