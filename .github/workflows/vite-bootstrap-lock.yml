name: Vite bootstrap lockfile refresh

on:
  push:
    branches:
      - modernize/vite-bootstrap-20260828
    paths:
      - package.json
      - .github/workflows/vite-bootstrap-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/vite-bootstrap-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh package-lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Vite bootstrap"
          git push origin HEAD:modernize/vite-bootstrap-20260828
