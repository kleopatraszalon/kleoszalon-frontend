name: Refresh fflate lockfile

on:
  push:
    branches: [fix/idle-deploy-fflate-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/idle-deploy-fflate-audit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh only fflate within declared dependency ranges
        run: npm update fflate --package-lock-only --no-audit --no-fund

      - name: Verify patched production dependency tree
        run: npm audit --omit=dev --audit-level=moderate

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update fflate to patched lockfile"
          git push origin HEAD:fix/idle-deploy-fflate-audit
