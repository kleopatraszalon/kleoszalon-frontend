name: Finance v5 route repair
on:
  push:
    branches: [feature/finance-v5-altegio-20260813]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-v5-altegio-20260813
      - name: Restore inventory taxonomy and finance routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          inv='const InventoryOperationsPage = lazy(() => import("./pages/InventoryOperationsPage"));\n'
          if inv not in s:
              anchor='const Logisztika = lazy(() => import("./pages/Logisztika"));\n'
              if anchor not in s: raise SystemExit('Logisztika import anchor missing')
              s=s.replace(anchor,anchor+inv,1)
          tax='const ProductTaxonomyReviewPage = lazy(() => import("./pages/ProductTaxonomyReviewPage"));\n'
          if tax not in s:
              anchor='const ProductsList = lazy(() => import("./pages/ProductsList"));\n'
              if anchor not in s: raise SystemExit('ProductsList import anchor missing')
              s=s.replace(anchor,anchor+tax,1)
          invroute='  { path: "/warehouse/operations", element: R(KIOSK_MANAGERS, <InventoryOperationsPage />) },\n'
          if invroute not in s:
              anchor='  { path: "/warehouse", element: A(<Logisztika />) },\n'
              if anchor not in s: raise SystemExit('warehouse route anchor missing')
              s=s.replace(anchor,anchor+invroute,1)
          taxroute='  { path: "/masterdata/products/taxonomy-review", element: R(MANAGEMENT, <ProductTaxonomyReviewPage />) },\n'
          if taxroute not in s:
              anchor='  { path: "/masterdata/products", element: A(<ProductsList />) },\n'
              if anchor not in s: raise SystemExit('masterdata products route anchor missing')
              s=s.replace(anchor,anchor+taxroute,1)
          old='  { path: "/finance/transactions", element: A(<Penzugy />) },'
          new='  { path: "/finance/transactions", element: A(<FinanceWorkspacePage />) },'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit route repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git add src/App.tsx
          git commit -m "fix(routes): restore inventory taxonomy and finance v5 routes"
          git push origin HEAD:feature/finance-v5-altegio-20260813
