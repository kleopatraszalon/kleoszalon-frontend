name: Apply safe lint warning batch 2

on:
  push:
    branches:
      - maint/lint-warning-batch2-20260828
    paths:
      - .github/workflows/lint-batch2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/lint-warning-batch2-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply behavior-neutral lint cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace('src/pages/Logisztika.taxonomy.test.tsx',
                  r'''expect(page).toContain('${x.product_type_name || ""} ${x.product_group_name || ""} ${x.product_category_name || ""}');''',
                  r'''expect(page).toContain(`\${x.product_type_name || ""} \${x.product_group_name || ""} \${x.product_category_name || ""}`);''')
          replace('src/pages/NavOnlineInvoicePage.xsd.test.tsx',
                  r'''expect(source).toContain('/queue/${id}/retry');''',
                  r'''expect(source).toContain(`/queue/\${id}/retry`);''')
          replace('src/pages/WorkOrderResumeFromCalendar.test.ts',
                  r'''expect(modal).toContain("navigate(`/workorders/${encodeURIComponent(workOrderId)}`,{replace:true})");''',
                  r'''expect(modal).toContain(`navigate(\`/workorders/\${encodeURIComponent(workOrderId)}\`,{replace:true})`);''')
          replace('src/pages/WorkOrderResumeFromCalendar.test.ts',
                  r'''expect(navigator).toContain("root.querySelector<HTMLElement>(`#${targetId}`)");''',
                  r'''expect(navigator).toContain(`root.querySelector<HTMLElement>(\`#\${targetId}\`)`);''')
          replace('src/pages/__tests__/lifecycle-policy-panel.contract.test.ts',
                  r'''expect(panel).toContain('notifications/${id}/retry')''',
                  r'''expect(panel).toContain(`notifications/\${id}/retry`)''')
          replace('src/pages/customer/CustomerAppointmentManageModal.test.ts',
                  r'''expect(source).toContain('/customer-portal/self-service/appointments/${appointment.id}/reschedule');''',
                  r'''expect(source).toContain(`/customer-portal/self-service/appointments/\${appointment.id}/reschedule`);''')
          replace('src/pages/finance/CashierAltegioParity.entry.test.ts',
                  r'''expect(finance).toContain("/payments/${payment.id}/refund")''',
                  r'''expect(finance).toContain(`/payments/\${payment.id}/refund`)''')
          replace('src/pages/finance/FinanceWorkspacePage.test.tsx',
                  r'''expect(source).toContain('/movements/${id}/cancel');''',
                  r'''expect(source).toContain(`/movements/\${id}/cancel`);''')
          replace('src/securityCookieSession.contract.test.ts',
                  r'''expect(source).toContain("headers.Authorization = `Bearer ${bearer}`");''',
                  r'''expect(source).toContain(`headers.Authorization = \`Bearer \${bearer}\``);''')
          replace('src/pages/workorders/WorkOrderInvoicePanel.tsx',
                  r'''throw{response:{data:{message:'Az üzleti validáció hibás.',errors:business.data?.errors}}}''',
                  r'''throw Object.assign(new Error('Az üzleti validáció hibás.'),{response:{data:{message:'Az üzleti validáció hibás.',errors:business.data?.errors}}})''')
          replace('scripts/run-release-lint.js',
                  'process.env.ESLINT_WARNING_BASELINE || 73',
                  'process.env.ESLINT_WARNING_BASELINE || 63')
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify reduced lint budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete frontend regression suite
        env:
          CI: true
        run: npm test -- --watchAll=false
      - name: Commit safe lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Logisztika.taxonomy.test.tsx src/pages/NavOnlineInvoicePage.xsd.test.tsx src/pages/WorkOrderResumeFromCalendar.test.ts src/pages/__tests__/lifecycle-policy-panel.contract.test.ts src/pages/customer/CustomerAppointmentManageModal.test.ts src/pages/finance/CashierAltegioParity.entry.test.ts src/pages/finance/FinanceWorkspacePage.test.tsx src/securityCookieSession.contract.test.ts src/pages/workorders/WorkOrderInvoicePanel.tsx scripts/run-release-lint.js
          git commit -m "Reduce legacy lint warning budget from 73 to 63"
          git push origin HEAD:maint/lint-warning-batch2-20260828
