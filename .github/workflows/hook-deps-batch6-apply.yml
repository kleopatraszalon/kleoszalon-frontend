name: Apply safe hook dependency batch 6

on:
  push:
    branches:
      - maint/hook-deps-batch6-20260828
    paths:
      - .github/workflows/hook-deps-batch6-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maint/hook-deps-batch6-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Stabilize low-risk remaining hook dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected pattern missing in {path}: {old[:180]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'src/pages/booking/AdvancedBookingLauncher.tsx',
              '},[lines,open]);',
              '},[lines,open,requirements]);'
          )

          replace(
              'src/pages/finance/CashRegisterShiftPanel.tsx',
              'import React,{useEffect,useMemo,useState} from "react";',
              'import React,{useCallback,useEffect,useMemo,useState} from "react";'
          )
          replace(
              'src/pages/finance/CashRegisterShiftPanel.tsx',
              ' async function loadCurrent(){',
              ' const loadCurrent=useCallback(async()=>{'
          )
          replace(
              'src/pages/finance/CashRegisterShiftPanel.tsx',
              '  finally{setLoading(false)}\n }\n async function loadHistory(){',
              '  finally{setLoading(false)}\n },[locationId,onShiftStatusChange,today]);\n const loadHistory=useCallback(async()=>{'
          )
          replace(
              'src/pages/finance/CashRegisterShiftPanel.tsx',
              '  }catch(e:any){setError(e?.response?.data?.message||"A vezetői kasszatörténet nem tölthető be.")}\n }\n useEffect(()=>{void loadCurrent()},[locationId]);\n useEffect(()=>{if(isManager)void loadHistory()},[locationId,allLocations]);',
              '  }catch(e:any){setError(e?.response?.data?.message||"A vezetői kasszatörténet nem tölthető be.")}\n },[allLocations,from,isAdmin,isManager,locationId,to]);\n useEffect(()=>{void loadCurrent()},[loadCurrent]);\n useEffect(()=>{if(isManager)void loadHistory()},[isManager,loadHistory]);'
          )

          replace(
              'scripts/run-release-lint.js',
              'process.env.ESLINT_WARNING_BASELINE || 12',
              'process.env.ESLINT_WARNING_BASELINE || 9'
          )
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify 9-warning budget
        run: npm run lint:strict
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Run complete Vitest regression suite
        env:
          CI: true
        run: npm test
      - name: Verify Vite production build
        env:
          CI: true
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/booking/AdvancedBookingLauncher.tsx src/pages/finance/CashRegisterShiftPanel.tsx scripts/run-release-lint.js
          git commit -m "Reduce hook dependency warning budget from 12 to 9"
          git push origin HEAD:maint/hook-deps-batch6-20260828
