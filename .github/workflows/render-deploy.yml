name: Render deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  automated-quality-gate:
    name: Frontend unit / integration / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # A historical CRA lock/optional-peer mismatch still requires npm install.
        # The Release Control Center records this build only after tests and live smoke pass.
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Production build
        env:
          CI: false
        run: npm run build

  deploy:
    name: Manual approval + production deploy
    needs: automated-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production-manual-approval
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      FRONTEND_URL: https://kleoszalon-frontend.onrender.com
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Require Render frontend deploy hook
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL secret is not configured." >&2
            exit 1
          fi

      - name: Trigger Render frontend deploy
        run: curl -fsS --retry 3 --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify live frontend contains expected VIR bundle marker
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 48); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$FRONTEND_URL/?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/index.html \
              && curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$FRONTEND_URL/asset-manifest.json?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/asset-manifest.json; then
              node -e "const m=require('/tmp/asset-manifest.json'); for(const v of Object.values(m.files||{})) if(typeof v==='string' && v.endsWith('.js')) console.log(v)" > /tmp/js-assets.txt
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if [[ "$asset" == http://* || "$asset" == https://* ]]; then
                  url="$asset"
                elif [[ "$asset" == /* ]]; then
                  url="$FRONTEND_URL$asset"
                else
                  url="$FRONTEND_URL/$asset"
                fi
                if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$url?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/app.js \
                  && grep -aFq '/api/transactions/cashier/shift/current' /tmp/app.js \
                  && grep -aFq '/api/transactions/release-control' /tmp/app.js; then
                  found=1
                  break
                fi
              done < /tmp/js-assets.txt
            fi
            [ "$found" -eq 1 ] && break
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo "Render frontend is reachable, but the expected VIR release bundle markers were not found." >&2
            exit 1
          fi
          echo "Render frontend release smoke PASS"

      - name: Publish frontend evidence to Release Control Center
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
          oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$oidc"
          payload="$(node -e 'process.stdout.write(JSON.stringify({entries:[{key:"version.frontend",status:"pass",evidence:`Frontend Git SHA ${process.env.GITHUB_SHA}; live bundle smoke PASS`},{key:"tests.frontend",status:"pass",evidence:"CI=true frontend test suite PASS"},{key:"build.frontend",status:"pass",evidence:"Production frontend build + live Render smoke PASS"}]}))')"
          published=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS --max-time 30 -o /tmp/release-evidence-response.json -w '%{http_code}' \
              -H "Authorization: Bearer $oidc" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_BASE_URL/api/uat/release-control/evidence" || true)"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null; then
              cat /tmp/release-evidence-response.json
              published=1
              break
            fi
            echo "Release Control endpoint not ready yet ($attempt/30, HTTP ${code:-network-error})."
            cat /tmp/release-evidence-response.json 2>/dev/null || true
            sleep 10
          done
          if [ "$published" -ne 1 ]; then
            echo "Frontend evidence could not be published to the Release Control Center." >&2
            exit 1
          fi
