name: Render deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: render-production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-quality-gate:
    name: Frontend strict quality / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify clean lockfile install
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json package.json

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint zero-error / warning-regression gate
        run: npm run lint:strict

      - name: Frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Strict production build
        env:
          CI: true
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build

      - name: Mark frontend release verification pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Quality gate passed; exact Render release verification pending",context:"release-control/render-frontend"}))')"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST --data "$body" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

  deploy:
    name: Manual approval + production deploy
    needs: automated-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production-manual-approval
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      FRONTEND_URL: https://kleoszalon-frontend.onrender.com
      API_BASE_URL: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Require Render frontend deploy hook
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL secret is not configured." >&2
            exit 1
          fi

      - name: Trigger exact Render frontend commit
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$RENDER_DEPLOY_HOOK_URL" == *'?'* ]] && sep='&'
          curl -fsS --retry 3 --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${GITHUB_SHA}"

      - name: Verify exact live frontend SHA and VIR bundle markers
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 60); do
            rm -f /tmp/release-meta.json /tmp/asset-manifest.json /tmp/js-assets.txt /tmp/app.js
            if ! curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$FRONTEND_URL/release-meta.json?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/release-meta.json; then
              echo "Waiting for frontend release metadata ($attempt/60)."
              sleep 10
              continue
            fi

            deployed_sha="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/release-meta.json','utf8'));process.stdout.write(String(x.git_commit||''))}catch{}")"
            if [ "$deployed_sha" != "$GITHUB_SHA" ]; then
              echo "Waiting for exact frontend SHA ($attempt/60): expected=$GITHUB_SHA current=${deployed_sha:-unknown}"
              sleep 10
              continue
            fi

            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$FRONTEND_URL/asset-manifest.json?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/asset-manifest.json; then
              node -e "const m=require('/tmp/asset-manifest.json'); for(const v of Object.values(m.files||{})) if(typeof v==='string' && v.endsWith('.js')) console.log(v)" > /tmp/js-assets.txt
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if [[ "$asset" == http://* || "$asset" == https://* ]]; then
                  url="$asset"
                elif [[ "$asset" == /* ]]; then
                  url="$FRONTEND_URL$asset"
                else
                  url="$FRONTEND_URL/$asset"
                fi
                if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$url?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/app.js \
                  && grep -aFq '/api/transactions/cashier/shift/current' /tmp/app.js \
                  && grep -aFq '/api/transactions/release-control' /tmp/app.js; then
                  found=1
                  break
                fi
              done < /tmp/js-assets.txt
            fi
            [ "$found" -eq 1 ] && break
            echo "Exact SHA is live, waiting for expected VIR bundle markers ($attempt/60)."
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo "Render frontend did not expose the exact workflow SHA with the expected VIR bundle markers." >&2
            exit 1
          fi
          echo "Render frontend exact SHA PASS: $GITHUB_SHA"
          echo "Render frontend release smoke PASS"

      - name: Publish frontend evidence to Release Control Center
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kleoszalon-release-control")"
          oidc="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$oidc"
          payload="$(node -e 'process.stdout.write(JSON.stringify({entries:[{key:"version.frontend",status:"pass",evidence:`Frontend Git SHA ${process.env.GITHUB_SHA}; exact Render release-meta SHA verified; live bundle smoke PASS`},{key:"tests.frontend",status:"pass",evidence:"npm ci + menu audit + TypeScript typecheck + ESLint warning-regression gate + CI test suite PASS"},{key:"build.frontend",status:"pass",evidence:"CI=true production build + exact Render SHA verification + live bundle smoke PASS"}]}))')"
          published=0
          for attempt in $(seq 1 30); do
            code="$(curl -sS --max-time 30 -o /tmp/release-evidence-response.json -w '%{http_code}' \
              -H "Authorization: Bearer $oidc" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_BASE_URL/api/uat/release-control/evidence" || true)"
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null; then
              cat /tmp/release-evidence-response.json
              published=1
              break
            fi
            echo "Release Control endpoint not ready yet ($attempt/30, HTTP ${code:-network-error})."
            cat /tmp/release-evidence-response.json 2>/dev/null || true
            sleep 10
          done
          if [ "$published" -ne 1 ]; then
            echo "Frontend evidence could not be published to the Release Control Center." >&2
            exit 1
          fi

      - name: Mark exact frontend release verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"success",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Exact Render SHA and Release Control evidence verified",context:"release-control/render-frontend"}))')"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST --data "$body" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"

      - name: Mark frontend release verification failure
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(node -e 'process.stdout.write(JSON.stringify({state:"failure",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,description:"Exact Render SHA or Release Control evidence verification failed",context:"release-control/render-frontend"}))')"
          curl -fsS --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST --data "$body" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
