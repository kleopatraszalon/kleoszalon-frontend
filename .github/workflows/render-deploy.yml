name: Render deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  automated-quality-gate:
    name: Frontend unit / integration / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm ci currently rejects the historical lock because npm 10 resolves an
        # optional yaml peer to 2.x while the committed lock still contains yaml 1.x.
        # npm install keeps the quality gate reproducible enough for this legacy CRA
        # app while allowing npm to reconcile optional peer metadata in the runner.
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Production build
        # The regular frontend-build workflow already compiles the legacy CRA app
        # with CI=false so historical ESLint warnings remain visible but do not block
        # a release. Tests above stay strict under CI=true.
        env:
          CI: false
        run: npm run build

  deploy:
    name: Manual approval + production deploy
    needs: automated-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-manual-approval
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
      FRONTEND_URL: https://kleoszalon-frontend.onrender.com
    steps:
      - name: Trigger Render frontend deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS --retry 3 --max-time 30 -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify live frontend contains cashier stage13
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 48); do
            if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$FRONTEND_URL/?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/index.html \
              && curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$FRONTEND_URL/asset-manifest.json?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/asset-manifest.json; then
              node -e "const m=require('/tmp/asset-manifest.json'); for(const v of Object.values(m.files||{})) if(typeof v==='string' && v.endsWith('.js')) console.log(v)" > /tmp/js-assets.txt
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                if [[ "$asset" == http://* || "$asset" == https://* ]]; then
                  url="$asset"
                elif [[ "$asset" == /* ]]; then
                  url="$FRONTEND_URL$asset"
                else
                  url="$FRONTEND_URL/$asset"
                fi
                if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$url?smoke=$GITHUB_RUN_ID-$attempt" -o /tmp/app.js \
                  && grep -aFq '/api/transactions/cashier/shift/current' /tmp/app.js; then
                  found=1
                  break
                fi
              done < /tmp/js-assets.txt
            fi
            [ "$found" -eq 1 ] && break
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo "Render frontend is reachable, but cashier Stage13 bundle marker was not found."
            exit 1
          fi
          echo "Render frontend cashier Stage13 smoke PASS"

      - name: Render deploy hook is not configured
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_FRONTEND_DEPLOY_HOOK_URL secret is not configured; Render deploy skipped."
