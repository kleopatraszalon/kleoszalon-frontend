name: Complete VIR admin menu repair
on:
  push:
    paths:
      - '.github/workflows/complete-admin-menu-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch Sidebar to canonical menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/Sidebar.tsx')
          s=p.read_text()
          imp="import{ADMIN_MENU}from'../config/adminMenu';\n"
          anchor="import{featureEnabled,menuEnabled,readStoredVirCustomization,VIR_CUSTOMIZATION_EVENT,type VirCustomization}from'../utils/virCustomization';\n"
          if imp not in s:
              s=s.replace(anchor,anchor+imp)
          s=s.replace("isStaff?STAFF:isAdmin?FALLBACK:menus","isStaff?STAFF:isAdmin?ADMIN_MENU:menus")
          old=" {id:994082,code:'saas.migration',name:'VIR Migrációs Központ v18',route:'/admin/saas?workspace=migration-center',children:[]}\n]};"
          new=" {id:994082,code:'saas.migration',name:'VIR Migrációs Központ v18',route:'/admin/saas?workspace=migration-center',children:[]},\n {id:994083,code:'saas.revenue',name:'SaaS Revenue Engine',route:'/admin/saas',children:[]}\n]};"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify canonical menu contract
        run: |
          grep -q "ADMIN_MENU" src/components/Sidebar.tsx
          grep -q "Intelligens várólista" src/config/adminMenu.ts
          grep -q "Customer Intelligence / Next Best Action" src/config/adminMenu.ts
          grep -q "Operational Risk & Control Register" src/config/adminMenu.ts
          grep -q "Üzletmenet-folytonossági GameDay" src/config/adminMenu.ts
          grep -q "Release Control Center" src/config/adminMenu.ts
          grep -q "SaaS Revenue Engine" src/components/Sidebar.tsx
      - name: Install and test
        run: |
          npm ci --include=dev
          npx tsc --noEmit
          npm test -- --runInBand
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.tsx
          if git diff --cached --quiet; then
            echo "No Sidebar changes required"
          else
            git commit -m "Use canonical complete VIR admin menu"
            git push origin HEAD:main
          fi
