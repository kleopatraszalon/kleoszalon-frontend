name: CI lockfile normalize

on:
  push:
    branches: [agent/ci-final-hardening-20260815]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-lockfile-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      REACT_APP_API_ORIGIN: https://kleoszalon-api-1.onrender.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ci-final-hardening-20260815

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking production audit fixes to lockfile
        shell: bash
        run: npm audit fix --package-lock-only --omit=dev --no-fund || true

      - name: Deterministic clean install
        run: npm ci --no-audit --no-fund

      - name: Capture production dependency audit
        shell: bash
        run: npm audit --omit=dev --json > audit-prod.json || true

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-audit
          path: audit-prod.json
          retention-days: 1

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: Complete frontend regression suite
        run: npm test -- --watchAll=false --runInBand

      - name: Production build
        env:
          CI: 'false'
        run: npm run build

      - name: Commit normalized lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already normalized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'ci: normalize frontend package lockfile'
            git push origin HEAD:agent/ci-final-hardening-20260815
          fi

      - name: Enforce high/critical production dependency gate
        run: node -e "const a=require('./audit-prod.json'); const v=a.metadata?.vulnerabilities||{}; console.log(v); if((v.high||0)+(v.critical||0)>0) process.exit(1)"
