name: Inventory v4 catalog fix
on:
  push:
    branches: [feature/inventory-operations-v4-20260813]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-operations-v4-20260813
      - name: Wire scoped inventory catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/InventoryOperationsPage.tsx')
          s=p.read_text()
          old='async function loadRefs(){const jobs=await Promise.all([api.get("/api/locations"),api.get("/api/products?include_inactive=1"),api.get("/api/services"),api.get("/api/product-categories"),api.get("/api/transactions/inventory/ops/units")]);setLocations(arr<Location>(jobs[0].data));setProducts(arr<Product>(jobs[1].data));setServices(arr<Service>(jobs[2].data));setCategories(arr<Category>(jobs[3].data));setUnits(arr<Unit>(jobs[4].data))}'
          new='async function loadRefs(){const jobs=await Promise.all([api.get("/api/locations"),api.get("/api/transactions/inventory/ops/catalog/products"),api.get("/api/transactions/inventory/ops/catalog/categories"),api.get("/api/transactions/inventory/ops/units")]);setLocations(arr<Location>(jobs[0].data));setProducts(arr<Product>(jobs[1].data));setCategories(arr<Category>(jobs[2].data));setUnits(arr<Unit>(jobs[3].data))}'
          if old not in s:
              raise SystemExit('loadRefs anchor not found')
          s=s.replace(old,new,1)
          anchor=' useEffect(()=>{void loadRefs().catch(()=>setError("A törzsadatok betöltése nem sikerült."))},[]);\n'
          extra=' useEffect(()=>{if(canMaster)void api.get("/api/services").then(r=>setServices(arr<Service>(r.data))).catch(()=>setServices([]));else setServices([])},[canMaster]);\n'
          if extra not in s:
              s=s.replace(anchor,anchor+extra,1)
          s=s.replace('api.get(`/api/transactions/inventory/ops/operations?limit=400`)','api.get(`/api/transactions/inventory/ops/operations?${locationQuery}&limit=400`)',1)
          p.write_text(s)
          PY
      - name: Commit catalog wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "kleopatraszalon"
          git config user.email "birtalan.zoltan1975@gmail.com"
          git add src/pages/InventoryOperationsPage.tsx
          git commit -m "fix(inventory): use scoped v4 catalog and location reports"
          git push origin HEAD:feature/inventory-operations-v4-20260813
