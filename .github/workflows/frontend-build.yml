name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: Frontend tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          output="$(npm test -- --watchAll=false 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            detail="$(printf '%s' "$output" | tail -c 6000 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Frontend test failure::$detail"
          fi
          exit "$code"

      - name: Build frontend
        env:
          CI: false
        shell: bash
        run: |
          set +e
          output="$(npm run build 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            detail="$(printf '%s' "$output" | tail -c 6000 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Frontend build failure::$detail"
          fi
          exit "$code"
