name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: Frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build frontend
        env:
          CI: false
        run: npm run build
