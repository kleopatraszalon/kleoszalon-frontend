name: Frontend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify clean lockfile install
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json package.json

      - name: Menu route audit
        run: node scripts/check-menu-routes.js

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint zero-error / warning-regression gate
        run: npm run lint:strict

      - name: Frontend tests
        env:
          CI: true
        shell: bash
        run: |
          set +e
          output="$(npm test -- --watchAll=false 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            summary="$(printf '%s\n' "$output" | grep -E '^(FAIL|PASS|Test Suites:|Tests:|Snapshots:|Time:|Ran all|[[:space:]]*●|[[:space:]]*Snapshot name:|[[:space:]]*Expected:|[[:space:]]*Received:)' | tail -n 100)"
            if [ -z "$summary" ]; then summary="$(printf '%s' "$output" | tail -c 5000)"; fi
            detail="$(printf '%s' "$summary" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Frontend test failure::$detail"
          fi
          exit "$code"

      - name: Strict production build
        env:
          CI: true
          DISABLE_ESLINT_PLUGIN: 'true'
        shell: bash
        run: |
          set +e
          output="$(npm run build 2>&1)"
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            detail="$(printf '%s' "$output" | tail -c 6000 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Frontend strict build failure::$detail"
          fi
          exit "$code"
