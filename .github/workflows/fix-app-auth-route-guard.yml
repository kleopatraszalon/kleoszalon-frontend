name: Patch App auth route guard
on:
  push:
    branches:
      - fix/app-auth-route-cookie-session-20260820
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/app-auth-route-cookie-session-20260820
          fetch-depth: 0
      - name: Patch App route guards and security contract
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          source = app.read_text()
          role_import = 'import { hasStoredRole } from "./utils/roles";'
          helper_import = 'import { hasStoredAuthToken } from "./utils/authSession";'
          if helper_import not in source:
              source = source.replace(role_import, role_import + '\n' + helper_import)
          old_getter = '''function getToken() {
            try {
              return typeof window === "undefined"
                ? null
                : localStorage.getItem("kleo_token") || localStorage.getItem("token");
            } catch {
              return null;
            }
          }
          '''
          if old_getter not in source:
              raise SystemExit('Expected legacy getToken() block not found in src/App.tsx')
          source = source.replace(old_getter, '')
          source = source.replace('getToken()', 'hasStoredAuthToken()')
          if 'localStorage.getItem("kleo_token")' in source or 'localStorage.getItem("token")' in source:
              raise SystemExit('Legacy token reads remain in src/App.tsx')
          app.write_text(source)

          test = Path('src/securityCookieSession.contract.test.ts')
          contract = test.read_text()
          marker = '  test("private route uses the cookie-session routing helper", () => {'
          new_test = '''  test("application router guards use the cookie-session routing helper", () => {
            const source = read("App.tsx");
            expect(source).toContain('import { hasStoredAuthToken } from "./utils/authSession"');
            expect(source).not.toMatch(/localStorage\\.getItem\\(\\s*["'](?:token|kleo_token)["']/);
            expect(source).not.toContain("function getToken()");
            expect((source.match(/hasStoredAuthToken\\(\\)/g) || []).length).toBeGreaterThanOrEqual(4);
          });

'''
          if 'application router guards use the cookie-session routing helper' not in contract:
              if marker not in contract:
                  raise SystemExit('Expected insertion marker not found in security contract test')
              contract = contract.replace(marker, new_test + marker)
          test.write_text(contract)
          PY
      - name: Remove temporary patch workflow
        run: rm .github/workflows/fix-app-auth-route-guard.yml
      - name: Commit patched auth guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/securityCookieSession.contract.test.ts .github/workflows/fix-app-auth-route-guard.yml
          git commit -m "fix(auth): route App guards through cookie session helper"
          git push origin HEAD:fix/app-auth-route-cookie-session-20260820
